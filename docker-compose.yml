services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: todoapp-api
    ports:
      - "1323:1323"
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGO_DB: todoapp
      JWT_SECRET: ${JWT_SECRET:-change_me_to_a_long_random_secret}
      PORT: 1323
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-todoapp_root}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: todoapp
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: todoapp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-todoapp_root}
      MYSQL_DATABASE: todoapp
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  mongo:
    image: mongo:8.0
    container_name: todoapp-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' localhost:27017/test | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

volumes:
  mysql_data:
  mongo_data:
